<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة الإدارة | نظام الخطة الأسبوعية</title>

<style>

/* باقي التنسيقات (لم أغيرها للحفاظ على الصفحة كاملة) */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Tahoma,Arial,sans-serif;
}

body{
  background:#f4f2e9;
  color:#222;
  min-height:100vh;
}

/* --- التعديلات للجدول فقط --- */

.schedule-table {
  border-collapse: separate;
  border-spacing: 0;
  table-layout: fixed;
  background: #fff;
  direction: rtl;
  border: 2px solid #6e4a65; /* لون العنابي */
}

.schedule-table th:first-child,
.schedule-table td:first-child {
  background: #6e4a65;  /* لون خلفية أيام الأسبوع */
  color: white;
  font-weight: bold;
  border-right: 2px solid #6e4a65;
  vertical-align: middle;
  font-size: 16px;
  padding: 10px 6px;
  position: relative;
}

.schedule-table thead tr:first-child th {
  background: #e4d7e1; /* لون فاتح لقمة الأعمدة */
  color: #6e4a65;
  font-size: 18px;
  font-weight: 900;
  padding: 12px 0;
  border-left: 1.5px solid #6e4a65;
}

.schedule-table thead tr:first-child th:first-child {
  position: relative;
  border-left: none;
}

/* مثلث مظلل في الزاوية العليا اليمينية */
.schedule-table thead tr:first-child th:first-child::after {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  width: 0;
  height: 0;
  border-style: solid;
  border-width: 0 25px 25px 0;
  border-color: transparent #6e4a65 transparent transparent;
  opacity: 0.8;
  z-index: 1;
}

.schedule-table td {
  text-align: center;
  font-weight: 600;
  font-size: 14px;
  padding: 6px 5px;
  border: 1px solid #ddd;
  overflow-wrap: break-word;
  min-height: 48px;
  vertical-align: middle;
  color: #3c2a43;
}

/* لون الخلايا الفارغة */
.schedule-empty {
  color: #aaa;
  font-weight: 400;
  font-style: italic;
}

/* استيراد كامل باقي التنسيقات الخاصة بك تحت نفس النمط */

</style>
</head>

<body>

<header class="topbar">

<div class="brand">

<img src="logo.jpeg" alt="شعار مدارس الفلاح">

<div>

<h1>
مدارس الفلاح الأهلية
</h1>

<p>
نظام الخطة الأسبوعية
</p>

</div>

</div>


<div class="admin-info">

<div
class="admin-name"
id="adminName">

لوحة الإدارة

</div>

<button
class="logout-btn"
id="logoutBtn">

تسجيل الخروج

</button>

</div>

</header>


<main class="container">

<!-- ======================================
     جدول الحصص
====================================== -->

<section class="card schedule-card">

  <div class="card-header">
    <h3>جدول الحصص</h3>
  </div>

  <div class="card-body">

    <div class="schedule-toolbar">

      <div class="form-group">
        <label for="scheduleGrade">الصف</label>
        <select id="scheduleGrade">
          <option value="">اختر الصف</option>
        </select>
      </div>

      <div class="form-group">
        <label for="scheduleSection">الشعبة</label>
        <select id="scheduleSection">
          <option value="">اختر الشعبة</option>
        </select>
      </div>

      <button
        type="button"
        class="schedule-open-btn"
        id="loadScheduleBtn">
        عرض جدول الحصص
      </button>

    </div>

    <div id="scheduleStatus" class="schedule-status"></div>

    <div id="scheduleResult" class="schedule-result">

      <div id="schedulePrintArea" class="schedule-preview">

        <div class="schedule-print-sheet">

          <div class="schedule-school-head">

            <div>
              <img
                src="logo.jpeg"
                class="schedule-school-logo"
                alt="شعار مدارس الفلاح">
            </div>

            <div class="schedule-school-name">
              مدارس الفلاح الأهلية
              <small>نظام الخطة الأسبوعية</small>
            </div>

            <div></div>

          </div>

          <div id="scheduleTitle" class="schedule-title">
            جدول الحصص
          </div>

          <div id="scheduleWeekNote" class="schedule-week-note"></div>

          <table class="schedule-table">

            <thead>
              <tr>
                <th>اليوم/ الحصة</th>
                <th>1</th>
                <th>2</th>
                <th>3</th>
                <th>4</th>
                <th>5</th>
                <th>6</th>
                <th>7</th>
                <th>8</th>
              </tr>
            </thead>

            <tbody id="scheduleTableBody"></tbody>

          </table>

          <div class="schedule-signatures">

            <div class="schedule-signature">
              رائد الصف حسب الخطة
              <div id="scheduleLeaderName"></div>
              <div class="schedule-signature-line"></div>
            </div>

            <div class="schedule-signature">
              مدير المدرسة
              <div id="schedulePrincipalName"></div>
              <div class="schedule-signature-line"></div>
            </div>

          </div>

          <div class="schedule-credit">
            تصميم وتطوير: محمد عامر أحمد
          </div>

          <div class="schedule-print-actions">

            <button
              type="button"
              class="schedule-print-btn"
              id="printScheduleBtn">
              طباعة
            </button>

            <button
              type="button"
              class="schedule-close-btn"
              id="clearScheduleBtn">
              إخفاء الجدول
            </button>

          </div>

        </div>

      </div>

    </div>

  </div>

</section>

<!-- باقي محتويات الصفحة كما هو بدون تغيير -->

</main>

<!-- باقي السكربتات وتحميل البيانات كما في الكود الأصلي -->

</body>
</html>
