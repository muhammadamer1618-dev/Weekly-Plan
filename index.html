<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام الخطة الأسبوعية | مدارس الفلاح الأهلية</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #073f34, #0b4b3e);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .wrapper {
      width: min(1050px, 100%);
      min-height: 570px;
      background: white;
      border-radius: 22px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .brand {
      background: #0b4b3e;
      color: white;
      padding: 48px 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-left: 5px solid #c9a548;
    }

    .brand img {
      width: 145px;
      max-height: 160px;
      object-fit: contain;
      background: white;
      padding: 8px;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    .brand h1 {
      font-size: 28px;
      margin-bottom: 7px;
    }

    .brand .en {
      color: #d9bd70;
      font-weight: bold;
      margin-bottom: 28px;
      letter-spacing: 1px;
    }

    .brand .system-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .brand .desc {
      font-size: 14px;
      line-height: 1.9;
      color: #ededed;
      max-width: 390px;
      margin: auto;
    }

    .login-side {
      padding: 48px 42px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-side h2 {
      color: #0b4b3e;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #0b4b3e;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d4d4d4;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #c9a548;
      box-shadow: 0 0 0 3px rgba(201,165,72,.14);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      background: #0b4b3e;
      color: white;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      background: #083d33;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 11px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }

    .message.error {
      display: block;
      background: #fdeaea;
      color: #9d2020;
    }

    .message.success {
      display: block;
      background: #e9f7ed;
      color: #17652c;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #777;
      line-height: 1.9;
      font-size: 13px;
    }

    .designer {
      color: #0b4b3e;
      font-weight: bold;
    }

    @media (max-width: 800px) {
      body {
        padding: 12px;
      }

      .wrapper {
        grid-template-columns: 1fr;
      }

      .brand {
        border-left: none;
        border-bottom: 5px solid #c9a548;
        padding: 30px 20px;
      }

      .brand img {
        width: 110px;
      }

      .brand h1 {
        font-size: 23px;
      }

      .brand .system-title {
        font-size: 20px;
      }

      .login-side {
        padding: 35px 22px;
      }
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <section class="brand">
      <div>
        <img src="logo.jpeg" alt="شعار مدارس الفلاح الأهلية">

        <h1>مدارس الفلاح الأهلية</h1>

        <div class="en">
          ALFALAH SCHOOLS
        </div>

        <div class="system-title">
          نظام الخطة الأسبوعية
        </div>

        <div class="desc">
          نظام إلكتروني لإعداد ومتابعة الخطط الأسبوعية
          وتنظيم محتوى الدروس والواجبات بما ييسر التواصل
          بين المدرسة والأسرة.
        </div>
      </div>
    </section>

    <section class="login-side">

      <h2>تسجيل الدخول</h2>

      <div class="subtitle">
        أدخل اسم المستخدم وكلمة المرور
      </div>

      <form id="loginForm">

        <div class="form-group">
          <label for="username">اسم المستخدم</label>
          <input
            type="text"
            id="username"
            placeholder="اسم المستخدم"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input
            type="password"
            id="password"
            placeholder="كلمة المرور"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" id="loginBtn">
          دخول
        </button>

        <div id="message" class="message"></div>

      </form>

      <div class="footer">
        <div>مدارس الفلاح الأهلية</div>
        <div class="designer">
          إعداد وتصميم محمد عامر أحمد
        </div>
      </div>

    </section>

  </div>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyBYxW_pdFvE1VZyDoTok4-EutPe6oigJhY",
      authDomain: "weekly-plan-3a743.firebaseapp.com",
      projectId: "weekly-plan-3a743",
      storageBucket: "weekly-plan-3a743.firebasestorage.app",
      messagingSenderId: "575884603803",
      appId: "1:575884603803:web:e8c4d82c69fd545bed313e"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);

    const loginForm = document.getElementById("loginForm");

    const loginBtn = document.getElementById("loginBtn");

    const message = document.getElementById("message");


    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }


    loginForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const username = document
        .getElementById("username")
        .value
        .trim()
        .toLowerCase();

      const password = document
        .getElementById("password")
        .value;

      if (!username || !password) {
        showMessage(
          "أدخل اسم المستخدم وكلمة المرور",
          "error"
        );
        return;
      }


      loginBtn.disabled = true;
      loginBtn.textContent = "جاري تسجيل الدخول...";


      try {

        let email;

        if (username === "admin") {

          email = "muhammadamer1618@gmail.com";

        } else {

          email = username + "@weeklyplan.local";

        }


        const credential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        const uid = credential.user.uid;


        const userRef =
          doc(db, "users", uid);


        const userSnapshot =
          await getDoc(userRef);


        if (!userSnapshot.exists()) {

          await signOut(auth);

          showMessage(
            "الحساب غير مسجل داخل النظام",
            "error"
          );

          return;
        }


        const userData =
          userSnapshot.data();


        if (userData.active === false) {

          await signOut(auth);

          showMessage(
            "هذا الحساب غير مفعل",
            "error"
          );

          return;
        }


        sessionStorage.setItem(
          "weeklyPlanUserName",
          userData.name || ""
        );

        sessionStorage.setItem(
          "weeklyPlanUserRole",
          userData.role || ""
        );

        sessionStorage.setItem(
          "weeklyPlanUserId",
          uid
        );


        if (userData.role === "admin") {

          window.location.href =
            "admin.html";

        }

        else if (
          userData.role === "classLeader"
        ) {

          window.location.href =
            "teacher.html";

        }

        else {

          await signOut(auth);

          showMessage(
            "لا توجد صلاحية دخول لهذا الحساب",
            "error"
          );

        }

      }

      catch (error) {

        console.error(error);

        let text =
          "اسم المستخدم أو كلمة المرور غير صحيحة";

        if (
          error.code ===
          "auth/too-many-requests"
        ) {
          text =
            "تم إجراء محاولات كثيرة، حاول بعد قليل";
        }

        if (
          error.code ===
          "auth/network-request-failed"
        ) {
          text =
            "تعذر الاتصال بالإنترنت";
        }

        showMessage(text, "error");
      }

      finally {

        loginBtn.disabled = false;
        loginBtn.textContent = "دخول";

      }

    });

  </script>

</body>
</html>
